apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: jessymi/computex-frontend:latest
          ports:
            - containerPort: 5173
          envFrom:
            - secretRef:
                name: computex-secrets
          env:
            - name: VITE_API_URL
              value: "/api"