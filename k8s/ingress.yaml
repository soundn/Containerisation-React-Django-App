apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: computex-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - computex.jecintatechworks.com
      secretName: computex-tls
  rules:
    - host: computex.jecintatechworks.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173