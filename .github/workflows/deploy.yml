name: Build, Push, and Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Computex
          file: ./Computex/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/computex-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/computex-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ComputexFrontend
          file: ./ComputexFrontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/computex-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/computex-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy to k3s
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Containerisation-React-Django-App
            git fetch origin main
            git reset --hard origin/main
            cd k8s
            sudo kubectl apply -f postgres-pvc.yaml
            sudo kubectl apply -f postgres-deployment.yaml
            sudo kubectl apply -f postgres-service.yaml
            sudo kubectl apply -f backend-deployment.yaml
            sudo kubectl apply -f backend-service.yaml
            sudo kubectl apply -f frontend-deployment.yaml
            sudo kubectl apply -f frontend-service.yaml
            sudo kubectl apply -f strip-prefix-middleware.yaml
            sudo kubectl apply -f ingress.yaml
            sudo kubectl rollout restart deployment backend
            sudo kubectl rollout restart deployment frontend
            sleep 15
            if curl -f -s -o /dev/null https://computex.jecintatechworks.com; then
              echo "Deploy successful."
            else
              echo "Health check FAILED. Rolling back..."
              sudo kubectl rollout undo deployment backend
              sudo kubectl rollout undo deployment frontend
              sleep 15
              if curl -f -s -o /dev/null https://computex.jecintatechworks.com; then
                echo "Rollback successful."
              else
                echo "CRITICAL: Rollback also failed. Manual intervention required."
                exit 1
              fi
            fi